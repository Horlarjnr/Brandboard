[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brandboard-backend"
version = "0.1.0"
description = "Backend API for BrandBoard banner generation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "bleach>=6.1,<7",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "langchain-openai>=0.2,<1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.6,<3",
    "sqlmodel>=0.0.22,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
