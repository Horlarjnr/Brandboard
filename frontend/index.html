<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrandBoard</title>
    <meta name="description" content="Save your brand once, then generate on-brand banners with a simple prompt." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Set the theme before first paint so there is no light/dark flash.
         Order: saved choice, then the device setting, then light. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('brandboard.theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
